spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${DATABASE_USER:taskflow}
spring.datasource.password=${DATABASE_PASSWORD:taskflow}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.config.import=optional:file:${TASKFLOW_LOCAL_SECRETS:./.env.local}[.properties]
taskflow.jwt.key=${TASKFLOW_JWT_KEY}
taskflow.demo.claim-code=${TASKFLOW_DEMO_CLAIM_CODE:}
taskflow.cors.allowed-origin=${TASKFLOW_FRONTEND_ORIGIN:http://localhost:4200}
